<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="body">
      <textarea id="answer" readonly rows="2"></textarea>
      <div id="keys">
        <button onclick="Clear()" class="yellow">C</button>
        <button onclick="redo()" class="yellow">⌫</button>
        <button onclick="appendToDIsplay('/')" class="yellow">/</button>
        <button onclick="appendToDIsplay('*')" class="yellow">*</button>
        <button onclick="appendToDIsplay('7')">7</button>
        <button onclick="appendToDIsplay('8')">8</button>
        <button onclick="appendToDIsplay('9')">9</button>
        <button onclick="appendToDIsplay('-')" class="yellow">-</button>
        <button onclick="appendToDIsplay('4')">4</button>
        <button onclick="appendToDIsplay('5')">5</button>
        <button onclick="appendToDIsplay('6')">6</button>
        <button onclick="appendToDIsplay('+')" class="yellow">+</button>
        <button onclick="appendToDIsplay('1')">1</button>
        <button onclick="appendToDIsplay('2')">2</button>
        <button onclick="appendToDIsplay('3')">3</button>
        <button onclick="answer('=')" class="yellow">=</button>
        <button onclick="appendToDIsplay('0')">0</button>
        <button onclick="appendToDIsplay('.')">.</button>
      </div>
    </div>
    <script src="ex4.js"></script>
  </body>
</html>
