<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Riot Games: League of Legends, Valorant, team games, shooting games and strategy games">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="css/moncss.css">
    <title>Riot games</title>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark fixed-top" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img id="riot" src="img/Riot_Mobile_logo.webp" width="50" alt="riot games">
            </a>

            <ul class="navbar-nav ms-auto me-3">
                <li class="nav-item">
                    <a class="nav-link lienNav" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link lienNav" href="#">Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link lienNav" href="#">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link lienNav lienNavD" href="#">Download</a>
                </li>
            </ul>

            <button class="btn btn-danger" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#settingsSidebar"
                    aria-controls="settingsSidebar">
                Settings
            </button>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end btn-danger" tabindex="-1" id="settingsSidebar"
         aria-labelledby="settingsTitle">
        <div class="offcanvas-header">
            <h1 class="offcanvas-title h1 text-danger" id="settingsTitle">Settings</h1>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body ">
            
                <a href="#" class="lienSide">Account</a><br>
                <a href="#" class="lienSide">Security</a><br>
                <a href="#" class="lienSide">Support</a><br>
            
        </div>
    </div>
   <div id="demo" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicators/dots -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>

  <!-- The slideshow/carousel -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="la.jpg" alt="Los Angeles" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="chicago.jpg" alt="Chicago" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="ny.jpg" alt="New York" class="d-block w-100">
    </div>
  </div>

  <!-- Left and right controls/icons -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/monjs.js"></script>
</body>
</html>
